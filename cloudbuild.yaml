# Google Cloud Build configuration for CareCircle (Backend & Frontend to Cloud Run)
steps:
  # 1. Build Backend Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/carecircle-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/carecircle-backend:latest'
      - './backend'
    id: 'build-backend'

  # 2. Build Frontend Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/carecircle-frontend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/carecircle-frontend:latest'
      - './frontend'
    id: 'build-frontend'

  # 3. Push Backend to Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/carecircle-backend:latest']
    id: 'push-backend'

  # 4. Push Frontend to Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/carecircle-frontend:latest']
    id: 'push-frontend'

  # 5. Deploy Backend to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'carecircle-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/carecircle-backend:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8000'
    id: 'deploy-backend'

  # 6. Deploy Frontend to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'carecircle-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/carecircle-frontend:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
    id: 'deploy-frontend'

images:
  - 'gcr.io/$PROJECT_ID/carecircle-backend:latest'
  - 'gcr.io/$PROJECT_ID/carecircle-frontend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
