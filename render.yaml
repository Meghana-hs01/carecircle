services:
  # Backend Web Service (FastAPI)
  - type: web
    name: carecircle-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: carecircle-postgres
          property: connectionString

  # Frontend Static Site (React 18 + Vite)
  - type: web
    name: carecircle-web
    runtime: static
    plan: free
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: carecircle-api
          property: host

databases:
  - name: carecircle-postgres
    plan: free
    region: oregon
    databaseName: carecircle
    user: carecircle_user
