version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: carecircle_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: carecircle
      POSTGRES_USER: carecircle_user
      POSTGRES_PASSWORD: carecircle_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carecircle_user -d carecircle"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carecircle_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql://carecircle_user:carecircle_password_2026@db:5432/carecircle
      - SECRET_KEY=production-secure-carecircle-secret-key-change-in-env
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - CRON_SECRET=carecircle-internal-job-token-2026
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-notifications@carecircle.health}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: carecircle_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:8080"

volumes:
  postgres_data:
